name: Build and Release Binaries

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Binaries
        env:
          CGO_ENABLED: 0
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o setup_server_amd64 main.go
          cp setup_server_amd64 setup_server
          GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o setup_server_arm64 main.go
          sha256sum setup_server setup_server_amd64 setup_server_arm64 > checksums.txt

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Release' }}
          prerelease: false
          files: |
            setup_server
            setup_server_amd64
            setup_server_arm64
            checksums.txt
